<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carimbo dinâmico Sistran</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#09213f;background:#f5f8fc;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.page{min-height:100vh;padding:clamp(24px,5vw,72px)}.top{max-width:900px;margin:0 auto 38px}.tag{color:#0757c7;font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.top h1{max-width:720px;margin:12px 0 10px;font-size:clamp(32px,5vw,66px);line-height:.94;letter-spacing:-.055em}.top p{max-width:640px;color:#51657c;font-size:17px;line-height:1.55}.lab{display:grid;grid-template-columns:minmax(0,1fr) 320px;max-width:1100px;margin:auto;overflow:hidden;border:1px solid #dfe8f3;border-radius:28px;background:white;box-shadow:0 24px 80px rgba(13,55,101,.12)}.stage{position:relative;display:grid;place-items:center;min-height:500px;padding:64px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff 0,#f4f8fd 64%,#e9f1fa 100%)}.stage:before{content:"";position:absolute;inset:0;opacity:.45;background-image:linear-gradient(#ccdaea 1px,transparent 1px),linear-gradient(90deg,#ccdaea 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle,#000,transparent 75%)}.panel{position:relative;padding:26px 22px;background:#071c36;color:#fff}.panel h2{margin:0 0 22px;font-size:15px}.control{display:grid;gap:8px;margin:0 0 18px}.control label{font-size:12px;color:#9eb1c6;font-weight:700}.choices{display:flex;flex-wrap:wrap;gap:7px}.choices button{border:1px solid #31506f;border-radius:8px;padding:8px 10px;color:#c8d6e5;background:#102b49;font:inherit;font-size:12px;cursor:pointer}.choices button.active{border-color:#3de0ff;color:#071c36;background:#3de0ff}.colors button{width:28px;height:28px;padding:0;border-radius:50%}.colors button.active{outline:2px solid white;outline-offset:2px}.replay{width:100%;margin-top:8px;border:0;border-radius:11px;padding:12px;color:#071c36;background:#fff;font-weight:800;cursor:pointer}.stamp{--c:#0757c7;--r:-3deg;position:relative;z-index:1;isolation:isolate;display:inline-flex;align-items:center;gap:.75em;width:max-content;max-width:100%;padding:.72em 1.15em;color:var(--c);background:transparent;border:.11em solid currentColor;border-radius:999px;font-size:clamp(17px,2.2vw,23px);line-height:1;transform:rotate(var(--r));box-shadow:inset 0 0 0 .05em color-mix(in srgb,currentColor 35%,transparent);user-select:none}.stamp:before{content:"";position:absolute;inset:.18em;z-index:-1;border:.035em dashed color-mix(in srgb,currentColor 50%,transparent);border-radius:inherit}.stamp:after{content:"";position:absolute;inset:-.12em;z-index:2;border-radius:inherit;opacity:.14;background:repeating-linear-gradient(101deg,transparent 0 .75em,currentColor .77em .79em,transparent .81em 1.3em);mix-blend-mode:multiply;pointer-events:none}.stamp .logo{display:grid;place-items:center;padding-right:.7em;border-right:.065em solid}.stamp svg{width:2.45em;height:2.45em}.copy{display:grid;gap:.14em}.small{font-size:.6em;font-weight:750;letter-spacing:.17em;text-transform:uppercase}.brand{font-size:1.18em;font-weight:900;letter-spacing:-.035em}.serial{display:none;font-size:.44em;font-weight:800;letter-spacing:.22em}.stamp.seal{aspect-ratio:1;min-width:9.4em;flex-direction:column;justify-content:center;gap:.4em;border-radius:50%;text-align:center}.stamp.seal .logo{padding-right:0;border:0}.stamp.seal .serial{display:block}.stamp.split{border-radius:.7em;padding-inline:.8em 1.2em}.stamp.split .logo{margin:-.65em 0;padding:.8em .95em .8em .15em;border-right-width:.12em}.stamp.ticket{border-radius:.35em 1.4em .35em 1.4em;clip-path:polygon(0 0,100% 0,100% 74%,94% 100%,0 100%)}.stamp.signature{padding-inline:.25em;border-width:0 0 .12em;border-radius:0;box-shadow:none}.stamp.signature:before{display:none}.stamp.orbit{padding:1.08em 1.4em;border:0;border-radius:50%;box-shadow:none}.stamp.orbit:before{inset:0;border:.08em solid;border-radius:50%;transform:rotate(-5deg) scaleX(1.05)}.stamp.orbit .logo{border-right-style:dashed}.stamp.monogram{min-width:8.4em;flex-direction:column;gap:.5em;border-radius:1.1em .25em 1.1em .25em;text-align:center}.stamp.monogram .logo{padding:0 0 .45em;border:0;border-bottom:.065em solid}.stamp.monogram .copy{text-align:center}.stamp.monogram .serial{display:block}.stamp.certificate{padding:.9em 1.35em;border-radius:0;outline:.055em solid color-mix(in srgb,currentColor 45%,transparent);outline-offset:-.38em}.stamp.certificate:before{inset:-.12em;border-style:solid;border-width:0 .15em;border-radius:0;transform:skewX(-3deg)}.stamp.certificate .serial{display:block}.stamp.solid{color:#fff;background:var(--c);border-color:var(--c);box-shadow:0 .55em 1.6em color-mix(in srgb,var(--c) 22%,transparent)}.stamp.glass{background:color-mix(in srgb,var(--c) 9%,rgba(255,255,255,.6));backdrop-filter:blur(12px) saturate(145%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 .65em 2em color-mix(in srgb,var(--c) 15%,transparent)}.animate{animation:stamp-in 720ms cubic-bezier(.18,.89,.32,1.28) both}@keyframes stamp-in{0%{opacity:0;transform:rotate(calc(var(--r) - 7deg)) scale(1.42);filter:blur(5px)}62%{opacity:1;transform:rotate(calc(var(--r) + 1deg)) scale(.94);filter:blur(0)}100%{opacity:1;transform:rotate(var(--r)) scale(1)}}@media(max-width:760px){.lab{grid-template-columns:1fr}.stage{min-height:360px;padding:40px 22px}.panel{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}.panel h2,.replay{grid-column:1/-1}.control{margin:0}}@media(prefers-reduced-motion:reduce){.animate{animation:none}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><span class="tag">Componente de assinatura</span><h1>Uma marca de autoria que parece viva.</h1><p>Texto real, símbolo vetorial e acabamento em CSS. Troque formato, cor e material sem exportar uma nova imagem.</p></header>
    <section class="lab" aria-label="Laboratório do carimbo">
      <div class="stage"><div id="stamp" class="stamp animate" aria-label="Realizado pela Sistran"><span class="logo" aria-hidden="true"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="currentColor" stroke-width="6.5"/><path d="M51 38h25l12 10" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 52l15 12h23" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="copy"><span class="small">Realizado pela</span><span class="brand">Sistran</span></span><span class="serial">SIS • 2026</span></div></div>
      <aside class="panel"><h2>Personalize o componente</h2><div class="control"><label>Formato</label><div class="choices" data-group="shape"><button class="active" data-value="capsule">Cápsula</button><button data-value="seal">Selo</button><button data-value="split">Dividido</button><button data-value="ticket">Recorte</button><button data-value="signature">Assinatura</button><button data-value="orbit">Órbita</button><button data-value="monogram">Monograma</button><button data-value="certificate">Certificado</button></div></div><div class="control"><label>Acabamento</label><div class="choices" data-group="finish"><button class="active" data-value="outline">Traço</button><button data-value="solid">Sólido</button><button data-value="glass">Glass</button></div></div><div class="control"><label>Cor</label><div class="choices colors" data-group="color"><button class="active" data-value="#0757c7" style="background:#0757c7" aria-label="Azul Sistran"></button><button data-value="#0ed8f6" style="background:#0ed8f6" aria-label="Ciano"></button><button data-value="#7139e8" style="background:#7139e8" aria-label="Violeta"></button><button data-value="#ed5b2a" style="background:#ed5b2a" aria-label="Coral"></button></div></div><button id="replay" class="replay">Repetir animação</button></aside>
    </section>
  </main>
  <script>
    const stamp=document.querySelector('#stamp');
    document.querySelectorAll('[data-group]').forEach(group=>group.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;group.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');const type=group.dataset.group,value=button.dataset.value;if(type==='color')stamp.style.setProperty('--c',value);else{const values=type==='shape'?['capsule','seal','split','ticket','signature','orbit','monogram','certificate']:['outline','solid','glass'];stamp.classList.remove(...values);stamp.classList.add(value)}}));
    document.querySelector('#replay').addEventListener('click',()=>{stamp.classList.remove('animate');void stamp.offsetWidth;stamp.classList.add('animate')});
  </script>
</body>
</html>
